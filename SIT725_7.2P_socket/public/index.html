<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SIT725 7.2P - Live Message Board</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    .row { margin-bottom: 10px; }
    #board { border: 1px solid #ccc; padding: 12px; height: 260px; overflow-y: auto; }
    .msg { padding: 8px; border-bottom: 1px solid #eee; }
    .meta { font-size: 12px; color: #666; margin-bottom: 4px; }
    .error { color: #b00020; margin-top: 8px; }
    input, button { padding: 8px; }
    input { width: 260px; }
    #text { width: 420px; }
  </style>
</head>
<body>
  <h1>Live Message Board (SIT725 7.2P)</h1>

  <div class="row">
    <strong>Online:</strong> <span id="online">0</span>
  </div>

  <div class="row">
    <label>Name:</label>
    <input id="name" placeholder="Your name (optional)" />
  </div>

  <div class="row">
    <label>Message:</label>
    <input id="text" placeholder="Type a message..." />
    <button id="send">Post</button>
  </div>

  <div id="board"></div>
  <div id="err" class="error"></div>

  <!-- Socket.IO client served automatically by the server -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const onlineEl = document.getElementById('online');
    const boardEl = document.getElementById('board');
    const errEl = document.getElementById('err');
    const nameEl = document.getElementById('name');
    const textEl = document.getElementById('text');
    const sendBtn = document.getElementById('send');

    function addMessage(msg) {
      const div = document.createElement('div');
      div.className = 'msg';

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `${msg.time} — ${msg.name}`;

      const body = document.createElement('div');
      body.textContent = msg.text;

      div.appendChild(meta);
      div.appendChild(body);
      boardEl.appendChild(div);

      // scroll to bottom
      boardEl.scrollTop = boardEl.scrollHeight;
    }

    // Online count updates
    socket.on('onlineCount', (count) => {
      onlineEl.textContent = count;
    });

    // Load last messages when joining
    socket.on('recentMessages', (msgs) => {
      boardEl.innerHTML = '';
      msgs.forEach(addMessage);
    });

    // New message broadcast
    socket.on('newMessage', (msg) => {
      addMessage(msg);
      errEl.textContent = '';
    });

    // Error display
    socket.on('errorMessage', (msg) => {
      errEl.textContent = msg;
    });

    function post() {
      socket.emit('postMessage', {
        name: nameEl.value,
        text: textEl.value
      });
      textEl.value = '';
      textEl.focus();
    }

    sendBtn.addEventListener('click', post);
    textEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') post();
    });
  </script>
</body>
</html>
